<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 150px;
            height: 150px;
            border: 2px solid black;
        }
        .box1{
            background-color: blue;
            z-index: 10;
            top: 20px;
            left: 20px;
            position: fixed;
        }
        .box2{
            background-color: red;
            z-index: 20;
            position: fixed;
            top: 60px;
            left: 60px;
        }
    </style>
</head>
<body>
    <div class="box box1">Box 1 hello</div>
    <div class="box box2">Box 2 hi</div>
</body>
</html>
