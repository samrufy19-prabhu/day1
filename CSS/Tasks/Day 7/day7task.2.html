<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .box{
        display: flex;
        border: 2px solid black;
        width: 200px;
        height: 100px;
        gap: 5px;
        flex-basis: 200px;
        justify-content: center;
        align-items: center;
       

       }
       .box1{
        border: 2px solid black;
        width: 50px;
        height: 20px;
        flex-grow: 1;
        
       

       }
        .box2{
        border: 2px solid black;
        width: 50px;
        height: 20px;
        flex-shrink: 0;

       }
        .box3{
        border: 2px solid black;
        width: 50px;
        height: 20px;

       }
       .container{
        border: 2px solid black;
        display: flex;
       }

       .container1{
        display: flex;
        border: 2px solid black;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 20px;
        
      
       }
       .item1{
        border: 2px solid black;
        width: 50px;
        height: 20px;
       }
        .item2{
        border: 2px solid black;
        width: 50px;
        height: 20px;
       }
        .item3{
        border: 2px solid black;
        width: 50px;
        height: 20px;
        flex: 1 0 150px;
       }
    </style>

</head>
<body>
    <div class="box">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
        <div class="box3">Box 3</div>
    </div>
    <div class="container">
  <div>1</div>
  <div>2</div>
  <div style="flex-basis: 200px">3</div>
  <div>4</div>
</div>
<div class="container1">
  <div class="item1">A</div>
  <div class="item2">B</div>
  <div class="item3">C</div>
  
</div>
</body>
</html>
