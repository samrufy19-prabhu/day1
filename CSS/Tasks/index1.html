<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            background-color: brown;
            font-size: medium;
            font-style: oblique;
        }
        .para{
            background-color: aqua;
            font-size: xx-large;
            font-style: italic;
        }
        #head{
            background-color: blueviolet;
        }
        *{
            background-color: brown;
        }
        nav li{
            background-color: blanchedalmond;
            font-size: x-large;
        }
        div>p{
            background-color: blueviolet;
        }
        h2+p{
            background-color: aqua;
            font-style: normal;
        }
        button:hover{
            background-color: aquamarine;
            font-size: 25px;
        }
        li:nth-child(even)
        {
            background-color: azure;
        }
        li:nth-child(1)
        {
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <h2>My Courses</h2>
    <h3 id="head">Languages</h3>
    <h3>HTML</h3>
    <h3 style="background-color: blue;">CSS</h3>
    <p>Cascading style sheet</p>
    <p class="para">Styling the HTML elements</p>
    <p class="para">Hypertext Markup language</p>
    <h2>Fruits</h2>
    <nav>
        <ul>
            <li>Apple</li>
            <li>Mango</li>
            <li>Orange</li>
       </ul>
    </nav>
    <div>
        <p>My favorite color is Pink</p>
        <section>
            <p>I like red color</p>
        </section>
    </div>
    <h2>My Profile</h2>
    <p>Name:XXX</p>
    <p>Number:12345</p>
    <p>Address:yyy</p>
    <button>Submit</button>
    <h3>Animals</h3>
    <ul>
        <li>Lion</li>
        <li>Bear</li>
        <li>Tiger</li>
        <li>Deer</li>
    </ul>
</body>    
</html>
