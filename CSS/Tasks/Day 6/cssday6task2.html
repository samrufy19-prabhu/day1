<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            margin: 30px;
            padding: 20px;      
          }
          nav{
            border: 2px solid black;
            padding: 30px;
          }
          img{
            border: 2px solid black;
            margin: 0 auto;
            display: block;
           
          }
          p{
            padding-left: 40px;
          }
          .box{
            box-sizing: content-box;
            padding: 20px;
            border: 2px solid black;
            width: 50px;
          }
          .parent{
            border: 2px solid black;
            display: flex;
            width: 150px;
            box-sizing: border-box;
          }
          .box1{
            border: 2px solid black;
          }
          .box2{
            border: 2px solid black;
          }
          .margin-top{
            border: 2px solid black;
           
            margin-top: 50px;
          }
          button{
            padding: 10px 20px;
          }
          .layout{
            border: 2px solid black;
          }
          article{
            margin-bottom:30px;
          }
          blockquote{
            border: 2px solid greenyellow;
            padding: 30px;
          }
          .flex{
             border: 2px solid black;
             display: flex;
             flex-direction: column;
             gap: 5px;
          }
          .modern{
             border: 2px solid black;
             box-shadow: 5px 5px;
             border-radius: 10px 10px;
             box-sizing: border-box;
          }
          .viewport{
            display: flex;
            border: 2px solid black;
            justify-content: center;
            align-items: center;

          }
    </style>
</head>
<body>
    <div>
        Hello, Good Morning! 
    </div>
    <nav>
        <a href="about">About</a>
        <a href="gallery">Gallery</a>
        <a href="contact">Contact</a>
    </nav>
    <img src="birds.jpeg" alt="birds" width="150" height="150">
    <p>Have a nice day</p>
    <section class="box">Box</section>
    <div class="parent">
        <main class="box1">Box 1</main>
        <main class="box2">Box 2</main>

    </div>
    <section class="margin-top">Section area</section><br> 
    <button>Click Me</button>
    <main class="layout">
    <article>
        This a article area
    </article>
    </main>
    <blockquote>Thank you for visiting our webpage</blockquote>
    <main class="flex">
        <p>My Contact details</p>
        <p>My Projects</p>
        <p>About Me</p>
    </main>
    <div class="modern">
        Forever grateful, thankful, feel blessed
    </div>
    <div class="viewport">
        Thank God for,what I have
    </div>

</body>
</html>
