<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{

        }h2{

            text-align: center;

        }
        button{

        }

        }
        header{
            background-color: coral;
            padding: 10px;
            margin: 10px;
        }
        section{
        
            padding: 10px;
            margin: 10px;
            border: 2px solid white;
            background-color: white;
            border-radius: 5px 5px;
            
        }
        footer{
            background-color: black;
            color: white;
            padding: 20px;
            margin: 10px;
        }

</head>
