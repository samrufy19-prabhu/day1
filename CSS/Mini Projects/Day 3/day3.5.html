<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-size: 10px;
        }
            h2{
                background-color: blue;
                font-size: 30px;

            }
            h3{
                color: red;
                background-color: white;

            }
            form{
                border: 2px solid black;
                height: 80vh;
                width: 600px;
                 display: flex;

                 row-gap: 1px; 
                 font-size: 2em;

            textarea{
                width: 50%
            }

                font-size: 2rem;

                background-color: red;

<body>
    <h2>Mini Project 5</h2>
    <h3>Contact Section</h3>

        <label>Name</label>
        <input type="name"><br><br>
        <label>Phone Number</label>
        <input type="number"><br><br>
        <label>Email ID</label>
        <input type="mail"><br><br>
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="5" cols="5"></textarea><br><br>        <button type="submit">Submit</button>

    </form>
