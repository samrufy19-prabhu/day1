<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }
        h1{
            background-color: orange;
        }
        h2{
            background-color: lightgreen;
        }
        header{
            font-size: 70px;
            font-weight: 1000;
        
        }
        p{
            font-size: x-large;


        }
        div{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            line-height: 2;
            background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20240919/pngtree-a-background-of-orange-blue-and-yellow-gradients-with-gritty-appearance-image_16233934.jpg');
            background-repeat: no-repeat;
            
            background-size: cover;
            height: 100vh;
            width: 100%;  
            row-gap: 20px;
         
        }
        button{
            background-color: pink;
            border-radius: 50px;
            font-weight: 800;
            font-size: larger;
            
        }
    </style>
</head>
<body>
    <h1>Mini Project 1</h1>
    <h2>Full Screen Landing Page</h2>
    <div>
    <header>Welcome to our website</header>
    <p>Discover amazing experience and creating lasting memories</p>
    <button>Get Started</button>
    </div>
    
</body>
</html>
