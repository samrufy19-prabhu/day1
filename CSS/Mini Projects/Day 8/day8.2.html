<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: blue;
        }
        .card{
            border: 2px solid black;
            display: flex;
            flex-wrap: wrap;
            flex-basis: 500px;
            width: 300px;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        button{
            align-self: flex-end;
        }
        .product{
           
             border: 2px solid black;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 300px;
            justify-content: center;
            align-items: center;
            gap: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .box{
            display: flex;
            gap: 10px;
            
            
        }
       
        .product1{
             border: 2px solid black;
             display: flex;
             width: 200px;
             height: 200px;
             flex-direction: column;
             justify-content: center;
            align-items: center;
            flex-grow: 1;
    
        }
         .product2{
             border: 2px solid black;
            display: flex;
             width: 200px;
             height: 200px;
           flex-direction: column;
             justify-content: center;
            align-items: center;
           
         }
        
         .product3{
             border: 2px solid black;
            display: flex;
            flex-direction: column;
             justify-content: center;
            align-items: center;
             width: 200px;
             height: 200px;
           
         }
         p{
            padding: 0;
            margin: 0;
         }
        


    </style>
    
</head>
<body>
    <h1>Mini Project 3</h1>
    <div class="card">
        <img src="user.jpeg" alt="joan" width="150" height="150">
        <p>Hello ! I am Prabhu</p>
        <h3>Frontend Developer</h3>
        <button>Hire Me</button>
    </div>

    <h1>Mini Project 4</h1>
    <div class="product">
        <h2>Our Products</h2>
        <div class="box">
            <section class="product1">
                <img src="headphone.jpeg" alt="product1" width="150" height="150">
                <p><b>Featured Headphones</b></p>
                <p><small>High-quality sound</small></p>
                <p>$199</p>
            </section>
             <section class="product2">
                <img src="ear buds.jpeg" alt="product1" width="150" height="150">
                <p><b>Wireless Earbuds</b></p>
                <p><small>Compact and powerful sound</small></p>
                <p>$799</p>
             </section>
             <section class="product3">
                <img src="watch.jpeg" alt="product1" width="150" height="120">
                <p><b>Smart Watch</b></p>
                <p><small>Track fitness and notifications</small></p>
                <p>$1999</p>
            </section>
        </div>
    </div>
</body>
</html>
