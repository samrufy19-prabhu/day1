<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .plans{
            display: flex;
            border: 2px solid black;
            gap: 30px;
            width: 400px;
            height: 200px;
            text-align: center;
        }
        .premium{
            background: linear-gradient(red,blue,green);
        }
        button{
            background-color: yellow;
        }

        nav{
            display: flex;
            border: 2px solid black;
            width: 800px;
            height: 200px;
            align-items: center;
            justify-content: space-between;
            background-color: pink;

        }
        nav:hover{
            color: red;
            font-size: 20px;
        }
    </style>
</head>
<body>
     <h1>Mini Project 5</h1>
    <h2>Pricing Table</h2>
    <main class="plans">
   
    <section class="basic">
        <P>Price:199</P>
        <p>Data:2GB</p>
        <p>Validity:28 days</p>
        <p>Calls:Unlimited</p>
        <button>Recharge</button>
</section>
 <section class="pro">
        <P>Price:299</P>
        <p>Data:4GB</p>
        <p>Validity:28 days</p>
        <p>Calls:Unlimited</p>
        <button>Recharge</button>
</section>
 <section class="premium">
        <P>Price:599</P>
        <p>Data:7GB</p>
        <p>Validity:28 days</p>
        <p>Calls:Unlimited</p>
        <button>Recharge</button>
</section>
</main>

</body>
</html>
