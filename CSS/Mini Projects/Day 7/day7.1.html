<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            display: flex;
            border: 2px solid black;
            flex-direction: column;
            width: 400px;
            text-align: center;
            background-color: lightcoral
        }
        main{
            width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(lightskyblue,lightblue);
        }
        div{
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
             border: 2px solid black;
             text-align: center;
             width: 200px;
             height: 200px;
             background: white;
              border-radius: 10px 10px;
              padding: 20px;
              margin: 50px;

        }
        input{
             width: 180px;
              border-radius: 5px 5px;
                padding: 7px;
        }
        button{
            background-color: lightskyblue;
            border-radius: 5px 5px;
            width: 180px;
            color: white;
            padding: 7px;
        }
    </style>
</head>
<body>
    <h1>Mini Project 1</h1>
    <h2>Navigation Bar</h2>
    <nav>
        <a href="about">About</a>
        <a href="gallery">Gallery</a>
        <a href="contact">Contact</a>
    </nav>
     <h1>Mini Project 2</h1>
    <h2>Login Form</h2>
    <main>
    <div>
        <h3>Login</h3>
        <form>
            <input type="name" placeholder="Username"><br><br>
            <input type="password" placeholder="Password"><br><br>
            <button>Login</button>
            
        </form>
    </div>
    </main>
</body>
</html>
