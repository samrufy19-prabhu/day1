<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Griffy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        h1{
            background-color: lightgreen;
        }
        h2{
            background-color: yellow;
            text-decoration: underline;
            text-align: center;
        }
        .card{
            border: 2px solid black;
            border-radius: 30px;
            box-shadow: 10px 10px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 500px;
            justify-items: center;
            align-items: center;
            font-family: griffy;
        }
        div{
            border: 2px solid black;
            text-align: center;
            color: goldenrod;
            font-size: 2em;
            padding: 5rem;
        }
        button{
            background-color: yellowgreen;
            font-size: large;
        }
        button:hover{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Mini Project 5</h1>
    <h2>Testimonials</h2>
    <article class="card">
        <section class="one">
        <figure>
            <img src="user1.png" alt="joanna" width="100" height="100">
        <figcaption>I am Joanna</figcaption>
        </figure>
        <p>I like this product. Easy to use</p>
        </section>
        <section class="two">
        <figure>
            <img src="user.jpeg" alt="Samuel" width="100" height="100">
        <figcaption>I am Samuel</figcaption>
        </figure>
        <p>I like this product. Smells good</p>
        </section>
        <section class="three">
        <figure>
            <img src="user1.png" alt="Adley" width="100" height="100">
        <figcaption>I am Adley</figcaption>
        </figure>
        <p>I like this product. But expensive.</p>
        </section>
    </article>
    <h1>Mini Projects 6</h1>
    <h2>Call to Action Section</h2>
    <div>
    <h3>Sign up Form</h3>
    <form>
        <label>Name</label>
        <input type="name"><br><br>
        <label>Email Id</label>
        <input type="email"><br><br>
        <label>Phone Number</label>
        <input type="number"><br><br>
        <button>Get Started Free</button>
    </form>
</div>
</body>
</html>
