<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h3>Form</h3> 
        <label>User Name:</label>
        <input type="text" pattern="[A-Z]"{3}><br><br>
    
    </form>
    <form>
        <h3>Login form</h3>
        <label>Email</label>
        <input type="text" required><br><br>
        <label>Password</label>
        <input type="password" minlength="8"><br><br>
        <button type="submit">Submit</button><br><br>
    </form>
    <form>
        <h3>Survey form</h3>
        <label>User ID</label>
        <input type="text" readonly><br><br>
        <label>Others</label>
        <input type="text" disabled>
    </form>
    <form>
        <h3>Quiz form</h3>
        <label>What is the color of the Milk?</label>
        <input type="text" autofocus><br><br>
        <label>Answer</label>
        <input type="text" placeholder="white">
        </form>
    </form>
    <form>
    <h3>User setting form</h3>
    <label>Email check</label>
    <input type="mail"><br><br>
    <label>Number</label>
    <input type="number" type="range" min="1" max="10"><br><br>
    <label>Address</label>
    <input type="address"><br><br>
    <label>Zip code</label>
    <input type="number" pattern="[0-9]"{6}>
    </form>

</body>
</html>
