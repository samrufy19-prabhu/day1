<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Form</h3>
    <form>
        <label>Name:</label>
        <input type="text"><br><br>
        <label>Number:</label>
        <input type="number"><br><br>
        <label>Email:</label>
        <input type="mail"><br><br>
        <label>Country:</label>
        <select name="country">
            <option value="india">India</option>
            <option value="slovenia">Slovenia</option>
            <option value="uk">UK</option>
        </select>
    </form><br>


    <h3>Comment</h3>
    <form>
        <label>Comment Section:</label>
        <textarea type="comment" rows="5" cols="5"></textarea>
        <input type="range" min="0" max="15">
    </form><br>


    <h3>Browser</h3>
    <form>
        <label>Search:</label>
        <input type="text">
        <datalist name="search">
            <option value="Chorme"></option>
            <option value="Firefox"></option>
            <option value="Safari"></option>
        </datalist>
    </form><br><br>


    <fieldset>
        <legend>Personal Information</legend>
    <form>
        <label>Name:</label>
        <input type="text"><br><br>
        <label>Number:</label>
        <input type="number"><br><br>
        <label>Email:</label>
        <input type="mail"><br><br>
    </form>
    </fieldset><br>


    <h3>Delivery Form</h3>
    <form>
        <label>Name:</label>
        <input type="text"><br><br>
        <label>Number:</label>
        <input type="number"><br><br>
        <label>Instructions</label>
        <textarea name="instruction" rows="5" cols="5"></textarea><br><br>
        <label>Payment mode:</label>
        <select name="Payment">
            <option value="cash">Cash:</option>
            <option value="card">Card:</option>
        </select>
    </form>
</body>
</html>
