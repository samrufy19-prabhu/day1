<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Registration Form</h3>
    <form>
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="dateofbirth">DOB:</label>
        <input type="number"><br><br>
        <label for="password">Password:</label>
        <input type="password"><br><br>
        <label for="file">File upload:</label>
        <input type="file"><br><br>
        <label for="color">Color Preference:</label>
        <input type="color">
    </form><br><br>

    <h3>Job Application Form</h3>
    <form>
        <label for="name">Name:</label>
        <input type="text"><br><br>
        <label for="mail">Email:</label>
        <input type="mail"><br><br>
        <label for="number">Number:</label>
        <input type="number"><br><Br>
        <label for="address">Address:</label>
        <textarea row="20" cols="10"></textarea><br><br>        <label for="resume">Upload Resume:</label>
        <input type="file"><br><br>
        <label for="position">Select Position</label>
        <select name="position">
            <option value="HR">HR</option>
            <option value="Manager">Manager</option>
            <option value="Specialist">Specialist</option><br><br>
            </select><br><br>
        <button type="submit">Submit</button>
    </form><br>

    <h3> Edit your Profile</h3>
    <form>
        <label for="user_id">User ID:</label> 
        <input type="hidden" name="user_id" value="123"><br><br>
        <label for="mail">Email:</label>
        <input type="email" disabled><br><br>
        <label for="experience">Experience</label>
        <input type="range" min="1" max="5"><br><br>
    </form>

    <h3>Color:</h3>
    <form>
        <label for="color">Select Color</label>
        <input type="color" >
        <p>Red</p>
    </form><br>

    <h3>Poll System</h3>
    <form>
        <label for="html">HTML</label>
        <input type="radio" name="html" value="html"><br><br>
        <label for="css">CSS</label>
        <input type="radio"><br><br>
        <label for="java">JAVA</label>
        <input type="radio"><br><br>
        <button name="submit">Submit</button>  
    </form>
    <p>Thank you</p>
</body>
</html>
