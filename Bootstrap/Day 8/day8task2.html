<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <style>
    .food-card {
      transition: transform 0.2s;
    }
    .food-card:hover {
      transform: translateY(-5px);
    }
    .food-img {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5">
    <h1 class="text-center mb-5">Our Menu</h1>
    
    <!-- Bootstrap Row -->
    <div class="row g-4">

      <!-- Item 1 -->
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="card h-100 shadow-sm food-card">
          <img src="burger.jpeg" class="card-img-top food-img" alt="Cheeseburger">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Classic Cheeseburger</h5>
            <p class="card-text text-success fw-bold fs-5">$9.99</p>
            <button class="btn btn-primary mt-auto">Order Now</button>
          </div>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="card h-100 shadow-sm food-card">
          <img src="pizza.jpeg" class="card-img-top food-img" alt="Pepperoni Pizza">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Pepperoni Pizza</h5>
            <p class="card-text text-success fw-bold fs-5">$12.99</p>
            <button class="btn btn-primary mt-auto">Order Now</button>
          </div>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="card h-100 shadow-sm food-card">
          <img src="salad.jpeg" class="card-img-top food-img" alt="Salad Bowl">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Fresh Salad</h5>
            <p class="card-text text-success fw-bold fs-5">$11.49</p>
            <button class="btn btn-primary mt-auto">Order Now</button>
          </div>
        </div>
      </div>

      <!-- Item 4 -->
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="card h-100 shadow-sm food-card">
          <img src="spaghetti.jpeg" class="card-img-top food-img" alt="Tacos">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">spaghetti</h5>
            <p class="card-text text-success fw-bold fs-5">$8.99</p>
            <button class="btn btn-primary mt-auto">Order Now</button>
          </div>
        </div>
      </div>

      <!-- Item 5 -->
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="card h-100 shadow-sm food-card">
          <img src="pancake.jpeg" class="card-img-top food-img" alt="Sushi Set">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Pancake</h5>
            <p class="card-text text-success fw-bold fs-5">$18.99</p>
            <button class="btn btn-primary mt-auto">Order Now</button>
          </div>
        </div>
      </div>

      <!-- Item 6 -->
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="card h-100 shadow-sm food-card">
          <img src="donut.jpeg" class="card-img-top food-img" alt="Chocolate Cake">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Chocolate donut</h5>
            <p class="card-text text-success fw-bold fs-5">$6.50</p>
            <button class="btn btn-primary mt-auto">Order Now</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
