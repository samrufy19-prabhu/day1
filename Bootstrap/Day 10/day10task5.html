<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
     <style>
        body {
            background-color: #f5f7fb;
        }

        .hero {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 80px 20px;
        }

        .feedback-box {
            max-width: 850px;
            margin: 50px auto;
        }

        .modal-header {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                CustomerCare
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>

                <!-- Give Feedback Button -->
                <button
                    class="btn btn-light text-primary fw-semibold"
                    data-bs-toggle="modal"
                    data-bs-target="#feedbackModal">
                    Give Feedback
                </button>
            </div>
        </div>
    </nav>


    <!-- Hero Section -->
    <section class="hero text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">
                We Value Your Feedback
            </h1>

            <p class="lead">
                Your feedback helps us improve our products and services.
            </p>

            <button
                class="btn btn-light btn-lg text-primary fw-semibold"
                data-bs-toggle="modal"
                data-bs-target="#feedbackModal">
                Share Your Experience
            </button>
        </div>
    </section>


    <!-- Success Alert -->
    <div class="container feedback-box">

        <div
            id="successAlert"
            class="alert alert-success alert-dismissible fade d-none"
            role="alert">

            <strong>Thank you!</strong>
            Thank you for your valuable feedback!

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-5">
                <h2 class="fw-bold">Your Opinion Matters</h2>

                <p class="text-muted mb-4">
                    We appreciate you taking the time to tell us about
                    your experience.
                </p>

                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#feedbackModal">
                    Give Feedback
                </button>
            </div>
        </div>

    </div>


    <!-- Feedback Modal -->
    <div
        class="modal fade"
        id="feedbackModal"
        tabindex="-1"
        aria-labelledby="feedbackModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="feedbackModalLabel">
                        Customer Feedback Form
                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>
                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form id="feedbackForm">

                        <!-- Customer Name -->
                        <div class="mb-3">
                            <label for="customerName" class="form-label">
                                Customer Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="customerName"
                                placeholder="Enter your name"
                                required>
                        </div>


                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                required>
                        </div>


                        <!-- Rating -->
                        <div class="mb-3">
                            <label class="form-label d-block">
                                Rating
                            </label>

                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating1"
                                    value="1"
                                    required>

                                <label class="form-check-label" for="rating1">
                                    1 ⭐
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating2"
                                    value="2">

                                <label class="form-check-label" for="rating2">
                                    2 ⭐
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating3"
                                    value="3">

                                <label class="form-check-label" for="rating3">
                                    3 ⭐
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating4"
                                    value="4">

                                <label class="form-check-label" for="rating4">
                                    4 ⭐
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating5"
                                    value="5">

                                <label class="form-check-label" for="rating5">
                                    5 ⭐
                                </label>
                            </div>
                        </div>


                        <!-- Service Type -->
                        <div class="mb-3">
                            <label for="serviceType" class="form-label">
                                Service Type
                            </label>

                            <select
                                class="form-select"
                                id="serviceType"
                                required>

                                <option value="" selected disabled>
                                    Select a service
                                </option>

                                <option>Customer Support</option>
                                <option>Product Purchase</option>
                                <option>Delivery Service</option>
                                <option>Technical Support</option>
                                <option>Other</option>

                            </select>
                        </div>


                        <!-- Feedback -->
                        <div class="mb-3">
                            <label for="feedback" class="form-label">
                                Feedback
                            </label>

                            <textarea
                                class="form-control"
                                id="feedback"
                                rows="4"
                                placeholder="Write your feedback here..."
                                required></textarea>
                        </div>


                        <!-- Terms Checkbox -->
                        <div class="mb-4 form-check">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="terms"
                                required>

                            <label
                                class="form-check-label"
                                for="terms">
                                I agree to the Terms and Conditions.
                            </label>
                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2">

                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                                Close
                            </button>

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Submit Feedback
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script> 
</body>

</html>
