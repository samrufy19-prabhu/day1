<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
     <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#newsletterModal"> 
  Apply Now
</button> 
<!-- Modal --> 
<div class="modal fade" id="newsletterModal"> 
  <div class="modal-dialog modal-dialog-centered"> 
    <div class="modal-content"> 
      <div class="modal-body p-5"> 
        <h4 class="mb-4">Application form</h4> 
        <form> 
             
             <div class="mb-3">
                  <label for="fullName" class="form-label">Full Name</label> 
            <input type="text" class="form-control" placeholder="Your name"> 
          </div> 
          <div class="mb-3"> 
            <label for="Phone number" class="form-label">Phone Number</label> 
            <input type="number" class="form-control" placeholder="Your number"> 
          </div> 
          <div class="mb-3"> 
            <label for="email" class="form-label">Email Id</label> 
            <input type="email" class="form-control" placeholder="Your email"> 
          </div> 
          <div class="mb-3"> 
            <label for="qualification" class="form-label">Qualification</label> 
            <input type="text" class="form-control"> 
          </div> 
          <div class="mb-3"> 
            <label for="experience" class="form-label">Experience</label> 
            <input type="number" class="form-control">
            
          </div> 
          <div class="mb-3"> 
            <label for="skills" class="form-label">Skills</label> 
            <input type="checkbox" class="form-check-input">HTML 
             <input type="checkbox" class="form-check-input">CSS
              <input type="checkbox" class="form-check-input">JAVA 
          </div> 
           <div class="mb-3"> 
            <label for="file" class="form-label">Upload Resume</label> 
            <input type="file">
            </div>

            <div class="mb-3"> 
            <label for="letter" class="form-label">Cover letter</label> 
            <textarea class="form-control" id="coverLetter" rows="6" placeholder="Write your cover letter here..."></textarea>
        


          
         
          <button class="btn btn-primary w-50">Submit Application</button> 
          <button class="btn btn-danger w-50">Cancel</button>
        </form> 
      </div> 
    </div> 
  </div> 
</div> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
