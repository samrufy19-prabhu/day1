<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#newsletterModal"> 
  Register
</button> 
<!-- Modal --> 
<div class="modal fade" id="newsletterModal"> 
  <div class="modal-dialog modal-dialog-centered"> 
    <div class="modal-content"> 
      <div class="modal-body p-5"> 
        <h4 class="mb-4">Registration form</h4> 
        <form> 
             
             <div class="mb-3">
                  <label for="fullName" class="form-label">Full Name</label> 
            <input type="text" class="form-control" placeholder="Your name"> 
          </div> 
          <div class="mb-3"> 
            <label for="Phone number" class="form-label">Phone Number</label> 
            <input type="number" class="form-control" placeholder="Your number"> 
          </div> 
          <div class="mb-3"> 
            <label for="email" class="form-label">Email Id</label> 
            <input type="email" class="form-control" placeholder="Your email"> 
          </div> 
          <div class="mb-3"> 
            <label for="password" class="form-label">Passowrd</label> 
            <input type="password" class="form-control" placeholder="Enter your password"> 
          </div> 
          <div class="mb-3"> 
            <label for="gender" class="form-label">Gender</label> 
            <input type="radio" class="form-check-input" placeholder="Male"> Male
             <input type="radio" class="form-check-input" placeholder="Female"> Female
          </div> 
          <div class="mb-3"> 
            <label for="courses" class="form-label">Courses</label> 
            <select class="form-select" aria-label="Default select example">
  <option selected>Open this select menu</option>
  <option value="1">HTML</option>
  <option value="2">CSS</option>
  <option value="3">JAVA</option>
</select>
          </div> 
          <div class="mb-3"> 
            <label for="skilld" class="form-label">Skills</label> 
            <input type="checkbox" class="form-check-input">HTML 
             <input type="checkbox" class="form-check-input">CSS
              <input type="checkbox" class="form-check-input">JAVA 
          </div> 
           <div class="mb-3"> 
            <label for="address" class="form-label">Address</label> 
            <textarea class="form-control" id="messageTextarea" rows="4" placeholder="Type your text here..."></textarea>

          
         
          <button class="btn btn-primary w-50">Register</button> 
          <button class="btn btn-danger w-50">Close</button>
        </form> 
      </div> 
    </div> 
  </div> 
</div> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
